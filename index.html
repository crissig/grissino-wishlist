<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grissino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF0EE;
    --surface: #F8FAF9;
    --ink: #14262B;
    --muted: #547962;
    --line: #C9D3D1;
    --accent: #D2491E;
    --accent-ink: #FFFFFF;
    --tint: #c3e1da;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #566e54;
      --surface: #162428;
      --ink: #E6EEEC;
      --muted: #9FB0B3;
      --subt: #202e2c;
      --line: #2A3D41;
      --accent: #F07848;
      --accent-ink: #1A0D07;
      --tint: #22363A;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding: 40px 16px 56px;
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }

  header { display: flex; flex-direction: column; gap: 12px; max-width: 62ch; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.02; letter-spacing: -0.02em;
    margin: 0; text-wrap: balance;
  }
  .intro { margin: 0; color: var(--muted); white-space: pre-line; }
  .intro2 { margin: 0; color: var(--muted); white-space: pre-line; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

  .art { background: var(--tint); border-bottom: 1px solid var(--line); }
  .art .main { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; }
  .art .ph {
    width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 5rem; color: var(--muted); opacity: 0.6;
  }
  .thumbs { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .thumbs button { padding: 0; border: 2px solid transparent; border-radius: 4px; background: none; cursor: pointer; width: 52px; height: 40px; overflow: hidden; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .body { padding: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 0; }
  .tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  .desc { margin: 0; color: var(--muted); font-size: 15px; white-space: pre-line; }
  .price { font-family: var(--font-mono); font-size: 15px; }

  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

  .shops { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .shops a {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 11px 14px; min-height: 44px; border-radius: 6px; text-decoration: none; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
  }
  .shops a span { font-family: var(--font-mono); font-weight: 400; font-size: 13px; }
  .shops a:hover { filter: brightness(1.07); }
  .note { margin: 0; font-size: 14px; font-style: italic; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  noscript { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="occasione"></div>
    <h1 id="titolo"></h1>
    <div class="eyebrow" id="occasione2"></div>
    <p class="intro" id="intro"></p>
  </header>
  <noscript>Per vedere la lista serve JavaScript attivo nel browser.</noscript>
  <main class="grid" id="grid"></main>
</div>

<!-- I contenuti della wishlist vengono caricati da data/wishlist.json e modificati dal pannello /admin/. -->
<script>
fetch("data/wishlist.json")
  .then(function (response) {
    if (!response.ok) throw new Error("Impossibile caricare la wishlist");
    return response.json();
  })
  .then(function (data) {
    var WISHLIST = data;
    (function () {
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null && text !== "") n.textContent = text;
        return n;
      }
      function safeUrl(u) {
        return /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : null;
      }
      function list(v) { return Array.isArray(v) ? v : (v ? [v] : []); }

      var W = WISHLIST || {};
      document.title = W.titolo || "Wish list";
      var occ = document.getElementById("occasione");
      W.occasione ? (occ.textContent = W.occasione) : occ.remove();
      var occ2 = document.getElementById("occasione2");
      W.occasione2 ? (occ2.textContent = W.occasione2) : occ2.remove();
      document.getElementById("titolo").textContent = W.titolo || "Wish list";
      var intro = document.getElementById("intro");
      W.intro ? (intro.textContent = W.intro) : intro.remove();
      var grid = document.getElementById("grid");
      list(W.regali).forEach(function (r) {
        var card = el("article", "card");
        var art = el("div", "art");
        var foto = list(r.foto).filter(Boolean);
        if (foto.length) {
          var main = el("img", "main");
          main.src = foto[0];
          main.alt = r.nome || "";
          main.loading = "lazy";
          art.appendChild(main);
          if (foto.length > 1) {
            var strip = el("div", "thumbs");
            foto.forEach(function (src, i) {
              var b = el("button");
              b.type = "button";
              b.setAttribute("aria-label", "Foto " + (i + 1));
              b.setAttribute("aria-current", i === 0 ? "true" : "false");
              var t = el("img"); t.src = src; t.alt = "";
              b.appendChild(t);
              b.addEventListener("click", function () {
                main.src = src;
                strip.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-current", "false"); });
                b.setAttribute("aria-current", "true");
              });
              strip.appendChild(b);
            });
            art.appendChild(strip);
          }
        } else {
          art.appendChild(el("div", "ph", (r.nome || "?").trim().charAt(0).toUpperCase()));
        }
        card.appendChild(art);
        var body = el("div", "body");
        if (r.categoria) body.appendChild(el("div", "tag", r.categoria));
        body.appendChild(el("h2", null, r.nome || "Senza nome"));
        if (r.descrizione) body.appendChild(el("p", "desc", r.descrizione));
        if (r.prezzo) body.appendChild(el("div", "price", r.prezzo));
        var opz = list(r.opzioni);
        if (opz.length) {
          var dl = el("dl");
          opz.forEach(function (o) {
            dl.appendChild(el("dt", null, o.nome));
            dl.appendChild(el("dd", null, o.valore));
          });
          body.appendChild(dl);
        }
        var negozi = list(r.negozi).filter(function (n) { return safeUrl(n.url); });
        if (negozi.length) {
          var shops = el("div", "shops");
          negozi.forEach(function (n) {
            var a = el("a");
            a.href = safeUrl(n.url);
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.appendChild(el("strong", null, n.nome || "Vai al negozio"));
            if (n.prezzo) a.appendChild(el("span", null, n.prezzo));
            shops.appendChild(a);
          });
          body.appendChild(shops);
        }
        if (r.nota) body.appendChild(el("p", "note", r.nota));
        card.appendChild(body);
        grid.appendChild(card);
      });
    })();
  })
  .catch(function (error) {
    document.getElementById("grid").textContent = "Non riesco a caricare la wishlist. Riprova più tardi.";
    console.error(error);
  });
</script>

<!-- =====================================================================

     ===================================================================== -->

</body>
</html>
